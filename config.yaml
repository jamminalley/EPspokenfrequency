# Configuration for the EP spoken frequency pipeline.
# Every tunable lives here; no thresholds are hard-coded in the package.
# Run: python -m scripts.build --config config.yaml

corpus:
  path: data/pt.txt.gz
  encoding: utf-8
  errors: replace
  # Published totals from the original build, used as the tokenizer
  # acceptance test (README "Source" section).
  expected:
    lines: 118469705
    tokens: 623920347
    types: 955446

run:
  # 1 = faithful baseline reproduction (fixes off, quality gate warns)
  # 2 = fixes enabled (see `fixes:`; quality gate fails the build)
  stage: 1
  sample_lines: null      # int => read only the first N lines (dev mode)
  workers: 8
  chunk_lines: 250000
  seed: 20260912

paths:
  cache_dir: .cache          # pass-1/pass-2 intermediates; gitignored
  out_dir: out_rebuild
  original_dir: out        # never written to
  eval_dir: eval
  reports:
    comparison: COMPARISON.md
    quality: QUALITY.md
    quality_tsv: quality_suspects.tsv
    override_review: override_review.tsv
    stats: build_stats.json
  gold:
    # Hand-checked gold set, authored outside this pipeline -- never
    # regenerated by the build.  See eval/README.md for how it was sampled
    # and for the jim_lemma / jim_verdict review convention.
    lemma_gold: lemma_gold.tsv
    backend_scores: backend_scores.md

tokenizer:
  lowercase: true
  strip_artifacts: true
  # Applied in order, before tokenization. Reconstructed from the README's
  # "subtitle-artifact stripping"; each is a regex replaced with a space.
  artifact_patterns:
    - '<[^>]{1,40}>'            # <i>, </i>, <font color=...>
    - '\{[^}]{1,40}\}'          # {\an8} ASS/SSA override tags
    - '\[[^\]]{1,60}\]'         # [SOUND], [MUSIC]
    - '\(([^)]{1,60})\)'        # (whispering)
    - '[♪♫♩ᴖ0]'  # musical notes
    - '^\s*-+\s*'               # leading dialogue dash
  # FALSE for the stage 1 baseline, despite the original README claiming
  # "enclitic-cluster splitting" in step 1.  The published outputs prove no
  # splitting happened: out/ contains unsplit clusters (`vai-te embora`,
  # `vou-me embora`, `levem-no` at rank 3492, `hei-de`, `há-de`), which
  # could not exist as tokens if clusters had been split.  Disabling it
  # reproduces the published token total to within 0.0014% (623,911,554 vs
  # 623,920,347) where splitting overshoots by 2.04%.
  # The splitter is implemented and tested; stage 2 can enable it.
  split_enclitics: false
  # Clitic pronouns that may attach after a hyphen. Longest-first matching.
  # Quoted: YAML 1.1 would otherwise read `no` as boolean false.
  enclitics: ["lhes", "lhe", "nos", "vos", "los", "las", "lo", "la",
              "me", "te", "se", "os", "as", "o", "a", "no", "na", "nas"]
  # Mesoclitic future/conditional infixes: dar-lhe-ia, far-se-a
  mesoclitic_suffixes: ["ia", "iam", "ias", "iamos", "a", "ao", "as", "emos", "ei"]
  keep_digits: false
  min_token_len: 1

lemmatizer:
  backend: simplemma          # simplemma | spacy | stanza | vote
  vote:
    members: [simplemma, spacy]
    tiebreak: [simplemma, spacy]   # deterministic tie-break order
  spacy_model: pt_core_news_lg
  stanza_lang: pt
  context:
    enabled: true             # lemmatize in sampled sentence context
    samples_per_type: 5
    max_types: 60000          # types (by rank) to collect context for
  validate_with_spellchecker: true
  spellchecker_lang: pt
  overrides_path: scripts/data/lemma_overrides.tsv

bigrams:
  min_constituent_count: 100
  min_g2: 2500.0
  min_collocation_share: 0.05
  # "collocation share >= 5%" in the README does not say share of what.
  # min  -> count / min(count(left), count(right))   most permissive
  # max  -> count / max(count(left), count(right))   most restrictive
  # See COMPARISON.md for the sweep that settled this.
  collocation_share_denominator: max
  # Deterministic memory control: at fixed chunk boundaries, drop pairs
  # seen fewer than prune_min_count times. Safe because min_g2 requires
  # counts in the thousands.
  prune_every_chunks: 40
  prune_min_count: 2

filters:
  # Verbatim from the original README.  `cara` is a mistake -- it is
  # ordinary EP for "face" -- but Stage 1 reproduces the original as built,
  # so the removal happens in Stage 2 via fixes.bp_exclusion_removals.
  bp_exclusions:
    ["aeromoça", "bacana", "banheiro", "cara", "celular", "galera",
     "geladeira", "legal", "mano", "massa", "né", "oi", "trem", "você",
     "vocês", "xícara", "ônibus"]
  proper_nouns:
    enabled: true
    # The original's OOV heuristic was lost and cannot be recovered from
    # out/: 14% of what it dropped IS in the PT dictionary (jack, mary) and
    # 845 lemmas it kept are not (including leaked names -- charlie, joe,
    # bob -- and legitimate pre-1990 EP spellings: óptimo, exactamente,
    # direcção). So this is a defensible reconstruction, not a replica, and
    # COMPARISON.md reports how far it agrees with the original's log.
    require_oov: true          # must be absent from the PT dictionary
    # Share of non-line-initial occurrences that are capitalized. Names sit
    # near 1.0 (john 1.00, maria 1.00); common nouns near 0 (casa 0.03).
    cap_ratio_threshold: 0.90
    # Stage 2 (fixes.extended_proper_nouns) relaxes the dictionary
    # requirement so that capitalization alone can catch a name the
    # dictionary happens to contain, such as `cristina`.
    stage2_cap_ratio_threshold: 0.85
    min_count: 1

# Stage 2 fixes. Each is independently switchable so its effect on the
# output can be measured in isolation.
fixes:
  diacritic_folding: false
  bp_after_folding: false
  extended_proper_nouns: false
  mwe_constituent_check: false
  # `cara` (face) is ordinary EP and was excluded in error by the original.
  bp_exclusion_removals: ["cara"]
  # Split forms that are ambiguous between lemmas (foi/fui/fomos/foram/fora
  # are ser or ir depending on context) by majority vote over the sampled
  # sentence contexts collected in pass 2.
  ambiguous_by_context: false
  # Enable the enclitic splitter the original README described but did not
  # apply.  Changes the token inventory substantially -- off until reviewed.
  split_enclitics: false
  ambiguous_forms:
    ["foi", "fui", "fomos", "foram", "fora", "era", "eram", "for"]
  mwe_constituent_whitelist: [d, c, s, p, q, n, dr, sr, sra]

quality:
  # Stage 1 reproduces the original's known flaws, so the gate warns.
  # Stage 2 sets this true (enforced in config validation).
  fail_on_suspects: false
  check_relemmatize: true
  check_diacritic_pairs: true
  check_inflected_forms: true
  whitelist_pairs: []       # ["nao|não", ...] pairs allowed to coexist

output:
  bands: [[1, 5000], [5001, 10000]]
  float_decimals: 3
  files:
    # band index -> stem; 0 is the first band (unnumbered, as in out/)
    - stem: ep_spoken_top5000
      anki_stem: ep_spoken
      deck: "Portuguese::European Portuguese - Spoken - First 5000"
    - stem: ep_spoken_5001_10000
      anki_stem: ep_spoken_5001_10000
      deck: "Portuguese::European Portuguese - Spoken - 5001 to 10000"
  qc_sample: qc_sample.csv
  dropped_proper_nouns: dropped_proper_nouns.txt
  anki:
    notetype: "Portuguese (EP) – Spoken Frequency"
    html: false
    separator: tab
    minimal_columns: [Rank, Lemma_PT, POS_guess, Is_MWE, Raw_Freq, Freq_per_million, Tags]
    enrichable_columns: [Rank, Lemma_PT, POS_guess, Gloss_EN, Example_PT, Example_EN, Is_MWE, Raw_Freq, Freq_per_million, Tags]
    tags:
      band500: 500
      band1000: 1000
      static: [source::opensubtitles_ep_v2018, variety::EP, register::spoken]
