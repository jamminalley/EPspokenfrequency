# Configuration for the EP spoken frequency pipeline.
# Every tunable lives here; no thresholds are hard-coded in the package.
# Run: python -m scripts.build --config config.yaml

corpus:
  path: data/pt.txt.gz
  encoding: utf-8
  errors: replace
  # Published totals from the original build, used as the tokenizer
  # acceptance test (README "Source" section).
  expected:
    lines: 118469705
    tokens: 623920347
    types: 955446

run:
  # 1 = faithful baseline reproduction (fixes off, quality gate warns)
  # 2 = fixes enabled (see `fixes:`; quality gate fails the build)
  stage: 1
  sample_lines: null      # int => read only the first N lines (dev mode)
  workers: 8
  chunk_lines: 250000
  seed: 20260912

paths:
  cache_dir: .cache          # pass-1/pass-2 intermediates; gitignored
  out_dir: out_rebuild
  original_dir: out        # never written to
  baseline_dir: out_rebuild # stage 1 output; what stage 2 is measured against
  eval_dir: eval
  reports:
    comparison: COMPARISON.md
    quality: QUALITY.md
    quality_tsv: quality_suspects.tsv
    override_review: override_review.tsv
    stats: build_stats.json
  gold:
    # Hand-checked gold set, authored outside this pipeline -- never
    # regenerated by the build.  See eval/README.md for how it was sampled
    # and for the jim_lemma / jim_verdict review convention.
    lemma_gold: lemma_gold.tsv
    backend_scores: backend_scores.md

tokenizer:
  lowercase: true
  strip_artifacts: true
  # Applied in order, before tokenization. Reconstructed from the README's
  # "subtitle-artifact stripping"; each is a regex replaced with a space.
  artifact_patterns:
    - '<[^>]{1,40}>'            # <i>, </i>, <font color=...>
    - '\{[^}]{1,40}\}'          # {\an8} ASS/SSA override tags
    - '\[[^\]]{1,60}\]'         # [SOUND], [MUSIC]
    - '\(([^)]{1,60})\)'        # (whispering)
    - '[♪♫♩ᴖ0]'  # musical notes
    - '^\s*-+\s*'               # leading dialogue dash
  # FALSE for the stage 1 baseline, despite the original README claiming
  # "enclitic-cluster splitting" in step 1.  The published outputs prove no
  # splitting happened: out/ contains unsplit clusters (`vai-te embora`,
  # `vou-me embora`, `levem-no` at rank 3492, `hei-de`, `há-de`), which
  # could not exist as tokens if clusters had been split.  Disabling it
  # reproduces the published token total to within 0.0014% (623,911,554 vs
  # 623,920,347) where splitting overshoots by 2.04%.
  # The splitter is implemented and tested; stage 2 can enable it.
  split_enclitics: false
  # When splitting (stage 2), undo the sound change the clitic forced on the
  # verb (fazê-lo -> fazer + lo, apanhámo-lo -> apanhámos + lo) and rejoin
  # mesoclitic futures (dar-lhe-ia -> daria + lhe).
  restore_clitic_stems: true
  # Clitic pronouns that may attach after a hyphen. Longest-first matching.
  # Quoted: YAML 1.1 would otherwise read `no` as boolean false.
  enclitics: ["lhes", "lhe", "nos", "vos", "los", "las", "lo", "la",
              "me", "te", "se", "os", "as", "o", "a", "no", "na", "nas"]
  # Mesoclitic future/conditional infixes: dar-lhe-ia, far-se-a
  mesoclitic_suffixes: ["ia", "iam", "ias", "iamos", "a", "ao", "as", "emos", "ei"]
  keep_digits: false
  min_token_len: 1

lemmatizer:
  backend: gated              # simplemma | spacy | stanza | vote | gated
  vote:
    # Needs 3+ members to mean anything: with 2, every disagreement is a
    # 1-1 tie and the tiebreak backend always wins.
    members: [simplemma, stanza]   # spaCy dropped: last by 7 points, emits non-words
    tiebreak: [stanza, simplemma]   # deterministic tie-break order
  # `gated`: primary backend, but when its lemma is not a PT dictionary word
  # (stanza's agradeçar, comprir) fall back to the secondary's answer.
  gate:
    primary: stanza
    fallback: simplemma
  # Stanza is ~1000x slower per type than simplemma, so it is used only for
  # types frequent enough to reach the published bands; the tail gets
  # simplemma. See COMPARISON.md for the runtime estimate.
  tiered:
    enabled: true
    # Derived from the stage 1 baseline: the lemma at rank 10,000 has a raw
    # count of 1,443, so any surface at or above 1443/safety_factor could
    # plausibly contribute to a published entry. Set explicitly rather than
    # computed, so the tier boundary is reproducible across runs.
    primary_min_count: 144
    safety_factor: 10
  spacy_model: pt_core_news_lg
  stanza_lang: pt
  stanza_workers: 4        # processes; each loads its own Stanza pipeline
  stanza_chunk: 200        # types per worker task
  context:
    enabled: true             # lemmatize in sampled sentence context
    samples_per_type: 5
    max_types: 60000          # types (by rank) to collect context for
  validate_with_spellchecker: true
  spellchecker_lang: pt
  overrides_path: scripts/data/lemma_overrides.tsv

bigrams:
  min_constituent_count: 100
  min_g2: 2500.0
  min_collocation_share: 0.05
  # "collocation share >= 5%" in the README does not say share of what.
  # min  -> count / min(count(left), count(right))   most permissive
  # max  -> count / max(count(left), count(right))   most restrictive
  # See COMPARISON.md for the sweep that settled this.
  collocation_share_denominator: max
  # Deterministic memory control: at fixed chunk boundaries, drop pairs
  # seen fewer than prune_min_count times. Safe because min_g2 requires
  # counts in the thousands.
  prune_every_chunks: 40
  prune_min_count: 2

filters:
  # Verbatim from the original README.  `cara` is a mistake -- it is
  # ordinary EP for "face" -- but Stage 1 reproduces the original as built,
  # so the removal happens in Stage 2 via fixes.bp_exclusion_removals.
  bp_exclusions:
    ["aeromoça", "bacana", "banheiro", "cara", "celular", "galera",
     "geladeira", "legal", "mano", "massa", "né", "oi", "trem", "você",
     "vocês", "xícara", "ônibus"]
  proper_nouns:
    enabled: true
    # The original's OOV heuristic was lost and cannot be recovered from
    # out/: 14% of what it dropped IS in the PT dictionary (jack, mary) and
    # 845 lemmas it kept are not (including leaked names -- charlie, joe,
    # bob -- and legitimate pre-1990 EP spellings: óptimo, exactamente,
    # direcção). So this is a defensible reconstruction, not a replica, and
    # COMPARISON.md reports how far it agrees with the original's log.
    require_oov: true          # must be absent from the PT dictionary
    # Share of non-line-initial occurrences that are capitalized. Names sit
    # near 1.0 (john 1.00, maria 1.00); common nouns near 0 (casa 0.03).
    cap_ratio_threshold: 0.90
    # Stage 2 (fixes.extended_proper_nouns) relaxes the dictionary
    # requirement so that capitalization alone can catch a name the
    # dictionary happens to contain, such as `cristina`.
    stage2_cap_ratio_threshold: 0.85
    min_count: 1

# Stage 2 fixes. Each is independently switchable so its effect on the
# output can be measured in isolation.
fixes:
  # Fold a lemma into the most frequent lemma that shares its accent-
  # stripped spelling when that one is >= diacritic_fold_ratio times as
  # frequent. Runs on lemmas, after lemmatization, so verb forms such as
  # está and é have already gone to estar and ser and cannot be merged with
  # esta or e. Every fold is listed in QUALITY.md.
  diacritic_fold_ratio: 20
  # (a) unaccented forms: nao -> não, numero -> número. Frequency only.
  diacritic_folding: false
  # (a') wrong or Brazilian accents: näo -> não, sâo -> são, prêmio ->
  # prémio, by accent-stripped match to a commoner lemma. No ratio: the
  # source must be absent from the PT dictionary, which is what keeps
  # pôr/por, quê/que, dê/de and avô/avó apart. Feminine -ã nouns
  # (cirurgiã, espiã) are exempt.
  accent_variant_folding: false
  bp_after_folding: false
  extended_proper_nouns: false
  mwe_constituent_check: false
  # Make the lemma inventory closed under its own lemmatizer: if `acha` is
  # an entry and lemmatizes to `achar`, which is also an entry, merge them.
  # This is the defect the rebuild set out to fix -- inflected forms
  # appearing as separate entries.
  lemma_closure: false
  # Inside closure: fold a regular plural onto its singular when the
  # singular is also an entry. The singular must be open-class (bens is not
  # the plural of the adverb bem) and the plural must not be listed below.
  # NOTE: the brief also asked that the plural not be a dictionary word, but
  # the PT dictionary contains regular plurals (anjos, casas, estados), so
  # that test would block every fold; this list is the working guard.
  plural_folding: false
  # A "plural" more than this many times as frequent as its "singular" is
  # not its plural (deus 750k vs deu; férias vs féria) and is left alone.
  plural_max_ratio: 5
  # The singular must be a PT dictionary word or have at least this many
  # tokens. Stops junk tail lemmas (*paí, *depoi) being fold targets while
  # still allowing words the dictionary lacks (elfo, gangue, slang).
  plural_min_singular_count: 1000
  plurale_tantum: ["óculos", "parabéns", "férias", "costas", "bens", "calças",
                   "pêsames", "arredores", "núpcias", "fezes", "cócegas",
                   "trevas", "víveres", "graças", "afazeres", "eis",
                   # invariant nouns: singular already, not plurals of
                   # something shorter (cais is a quay, not two `cal`)
                   "cais", "cosmos", "lápis", "vírus", "atlas", "pires",
                   "oásis", "ténis", "bónus", "ónus", "tórax", "caos",
                   "pâncreas", "íris", "génesis", "crise", "ás"]
  # English plurals (zombies, chips, t-shirts) go to the foreign-word
  # filter rather than being folded: absent from the PT dictionary, present
  # in pyspellchecker's English one.
  english_plurals_foreign: false
  # Split a surface's count across lemmas by per-occurrence Stanza tags over
  # the sampled contexts instead of giving the whole count to one lemma:
  # participles (VERB -> infinitive, ADJ -> masculine participle, NOUN ->
  # the noun), and the forms listed in ambiguous_forms (fomos: ir|ser).
  split_ambiguous: false
  ambiguous_forms: ["foi", "fui", "fomos", "foram", "fora", "for", "esta"]
  irregular_participles: ["morto", "feito", "dito", "visto", "escrito",
                          "aberto", "posto", "coberto", "preso", "solto",
                          "aceite", "entregue", "ganho", "gasto", "pago",
                          "eleito", "suspenso", "expulso", "aceso", "frito",
                          "descoberto", "desfeito", "satisfeito", "proposto",
                          "composto", "imposto", "disposto", "exposto",
                          "morta", "feita", "dita", "vista", "escrita",
                          "aberta", "posta", "presa", "solta", "paga"]
  # `cara` (face) is ordinary EP and was excluded in error by the original.
  bp_exclusion_removals: ["cara"]
  # ser/ir disambiguation needs no flag: a context-aware backend (stanza)
  # votes over the sampled sentences collected in pass 2 and resolves
  # foi/fui/fomos/foram from real usage, which is what the original
  # README's headline caveat asked for.
  #
  # Enclitic splitting is NOT part of stage 2. The original README claims
  # it but the published outputs disprove it, and turning it on changes the
  # token inventory wholesale (2% more tokens, 13% fewer types) rather than
  # correcting a defect. Kept as a separate, reviewable switch.
  split_enclitics: false
  # Abbreviations only. Single letters were listed here originally and that
  # defeated the check: `d` and `c` are exactly the junk fragments the `d c`
  # example is made of. Real one-letter Portuguese words (a, e, o, à) are in
  # the dictionary already and need no whitelist entry -- which is why
  # legitimate MWEs like `o que`, `é que` and `à noite` still pass.
  mwe_constituent_whitelist: ["dr", "sr", "sra", "mr", "ms", "st"]

# Headword policies from eval/conventions.md. A top-level section rather
# than part of `lemmatizer:` on purpose: the lemma cache is keyed on the
# lemmatizer settings, and these run after the backend, so changing a
# convention must not force another hour of Stanza.
conventions:
  enabled: true              # applied in stage 2 only
  # 1. Contractions are their own entries (the main departure from Davies).
  contractions:
    enabled: true
    forms: ["ao", "aos", "à", "às", "do", "da", "dos", "das", "no", "na",
            "nos", "nas", "pelo", "pela", "pelos", "pelas", "num", "numa",
            "nuns", "numas", "dum", "duma", "duns", "dumas",
            "deste", "desta", "destes", "destas", "desse", "dessa", "desses",
            "dessas", "daquele", "daquela", "daqueles", "daquelas", "disto",
            "disso", "daquilo", "neste", "nesta", "nestes", "nestas", "nesse",
            "nessa", "nesses", "nessas", "naquele", "naquela", "naqueles",
            "naquelas", "nisto", "nisso", "naquilo", "àquele", "àquela",
            "àqueles", "àquelas", "àquilo", "dele", "dela", "deles", "delas",
            "nele", "nela", "neles", "nelas", "daqui", "daí", "dali", "noutro",
            "noutra", "noutros", "noutras", "doutro", "doutra",
            "comigo", "contigo", "connosco", "convosco"]
    # `consigo` (com + si) is deliberately absent: in speech it is almost
    # always the verb -- "não consigo", 1sg of conseguir -- and forcing it
    # to a pronoun headword stole 350,530 tokens from conseguir.
  # 2. Gendered nouns fold into the masculine, unless the feminine has its
  # own meaning. No automatic test tells menina/menino (fold) from
  # música/músico (keep) -- simplemma folds every -a form and stanza keeps
  # every feminine noun -- so pairs are listed and reviewed in pairs_file,
  # like the lemma gold set: jim_decision overrides claude_decision.
  gender:
    enabled: true
    pairs_file: eval/gender_pairs.tsv
    exceptions: ["ferida", "cara"]   # always kept, whatever the file says
  # 3. Diminutives stay separate (coisinha, patinho, dinheirinho).
  diminutives:
    enabled: true
  # Clitic l-forms are allomorphs of o/a/os/as (vê-lo = vê + o), as the gold
  # set records. Only appear as tokens once enclitics are split.
  clitic_allomorphs:
    lo: o
    la: a
    los: os
    las: as
  # 4. Comparatives and superlatives are their own lemmas.
  comparatives:
    enabled: true
    forms:
      maior: ["maior", "maiores"]
      melhor: ["melhor", "melhores"]
      pior: ["pior", "piores"]
      menor: ["menor", "menores"]
  # 5. Pre-1990 spellings merge under the post-1990 spelling, but only when
  # the old spelling is not in the PT dictionary and the new one is -- which
  # leaves facto and contacto (still correct in European spelling) alone.
  spelling_reform:
    enabled: true

quality:
  # Stage 1 reproduces the original's known flaws, so the gate warns.
  # Stage 2 sets this true (enforced in config validation).
  fail_on_suspects: false
  check_relemmatize: true
  check_diacritic_pairs: true
  check_inflected_forms: true
  # Gender pairs are normally two real entries (menino/menina), and the rule
  # also fires on contractions (na/no, pela/pelo) and non-words (problemo).
  # Off: it produced ~1,200 spurious suspects and made the gate unusable.
  inflection_include_gender: false
  whitelist_pairs:
    # 44 pairs accepted as legitimately distinct (diacritic 44).
    # Generated by scripts/make_whitelist.py; see that module for the rule.
    - "ai|aí"
    - "aquele|àquele"
    - "aquilo|àquilo"
    - "avó|avô"
    - "a|à"
    - "baba|babá"
    - "bebé|bebê"
    - "caca|caça"
    - "calcar|calçar"
    - "calculo|cálculo"
    - "circulo|círculo"
    - "coca|coça"
    - "coco|cocó"
    - "dai|daí"
    - "divida|dívida"
    - "do|dó"
    - "duvida|dúvida"
    - "fluido|fluído"
    - "forcar|forçar"
    - "individuo|indivíduo"
    - "inicio|início"
    - "lá|lã"
    - "maca|maçã"
    - "magnifico|magnífico"
    - "mama|mamã"
    - "marco|março"
    - "matricula|matrícula"
    - "ma|má"
    - "moca|moça"
    - "nos|nós"
    - "noticia|notícia"
    - "no|nó"
    - "o|ó"
    - "papa|papá"
    - "policia|polícia"
    - "porque|porquê"
    - "por|pôr"
    - "principio|princípio"
    - "pro|pró"
    - "que|quê"
    - "radio|rádio"
    - "sitio|sítio"
    - "vitima|vítima"
    - "vovó|vovô"

output:
  bands: [[1, 5000], [5001, 10000]]
  float_decimals: 3
  files:
    # band index -> stem; 0 is the first band (unnumbered, as in out/)
    - stem: ep_spoken_top5000
      anki_stem: ep_spoken
      deck: "Portuguese::European Portuguese - Spoken - First 5000"
    - stem: ep_spoken_5001_10000
      anki_stem: ep_spoken_5001_10000
      deck: "Portuguese::European Portuguese - Spoken - 5001 to 10000"
  qc_sample: qc_sample.csv
  # Committed: entries with >= dropped_min_count occurrences. The full list
  # (~260k entries, 10 MB, nearly all hapax noise) goes to the _full file,
  # which .gitignore excludes.
  dropped_proper_nouns: dropped_proper_nouns.txt
  dropped_proper_nouns_full: dropped_proper_nouns_full.txt
  dropped_min_count: 100
  anki:
    notetype: "Portuguese (EP) – Spoken Frequency"
    html: false
    separator: tab
    minimal_columns: [Rank, Lemma_PT, POS_guess, Is_MWE, Raw_Freq, Freq_per_million, Tags]
    enrichable_columns: [Rank, Lemma_PT, POS_guess, Gloss_EN, Example_PT, Example_EN, Is_MWE, Raw_Freq, Freq_per_million, Tags]
    tags:
      band500: 500
      band1000: 1000
      static: [source::opensubtitles_ep_v2018, variety::EP, register::spoken]
